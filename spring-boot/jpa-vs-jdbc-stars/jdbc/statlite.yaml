server:
  listen: "127.0.0.1:9091"

storage:
  sqlite_path: "./statlite-stars.sqlite"
  retention_days: 7

polling:
  interval: "30s"
  timeout: "5s"

targets:
  - name: "star-pulse-jdbc"
    type: "spring"
    url: "http://127.0.0.1:8080/actuator"
  - name: "statlite-self"
    type: "statlite-metrics"
    url: "http://127.0.0.1:9091/statlite/metrics"
