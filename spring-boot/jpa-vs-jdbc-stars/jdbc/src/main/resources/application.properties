spring.application.name=stars-jdbc
server.port=8080
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=1
server.tomcat.accept-count=10
server.tomcat.max-connections=20
spring.datasource.url=jdbc:h2:file:./data/starsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.sql.init.mode=always
app.github.repos=PVRLabs/statlite,PVRLabs/aibadger,scriptella/scriptella-etl
app.github.api-base-url=https://api.github.com
app.github.token=${GITHUB_TOKEN:}
app.poll.interval-ms=600000
app.poll.initial-delay-ms=3000
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Star Pulse JDBC
