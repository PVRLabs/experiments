# StatLite monitor for this Star Pulse app.
# App must already be listening on :8080 (./run.sh).
#
#   statlite --config ./statlite.yaml
#   open http://127.0.0.1:9091

server:
  listen: "127.0.0.1:9091"

storage:
  sqlite_path: "./statlite-stars.sqlite"
  retention_days: 7

polling:
  interval: "30s"
  timeout: "5s"

targets:
  - name: "star-pulse"
    actuator_base_url: "http://127.0.0.1:8080/actuator"
  - name: "statlite-self"
    type: "statlite-metrics"
    url: "http://127.0.0.1:9091/statlite/metrics"
