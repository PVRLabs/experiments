quarkus.application.name=stars
quarkus.http.port=8081
# Framework-specific low-resource bounds. These are not equivalent to the
# Spring/Tomcat worker-thread setting and are recorded with each experiment.
quarkus.http.io-threads=1
quarkus.vertx.event-loops-pool-size=1
quarkus.thread-pool.core-threads=1
quarkus.thread-pool.max-threads=4

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data-quarkus/starsdb;AUTO_SERVER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.min-size=1
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.jdbc.timezone=UTC

app.github.repos=PVRLabs/statlite,PVRLabs/aibadger,scriptella/scriptella-etl
app.github.api-base-url=https://api.github.com
app.github.poll-interval=5m

quarkus.rest-client.github.url=${app.github.api-base-url}
quarkus.rest-client.github.connect-timeout=5000
quarkus.rest-client.github.read-timeout=10000

quarkus.micrometer.export.prometheus.path=metrics
quarkus.micrometer.binder.http-server.match-patterns=/=/*,/refresh=/refresh
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c] (%t) %s%e%n
