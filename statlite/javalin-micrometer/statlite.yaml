server:
  listen: "127.0.0.1:19087"
storage:
  sqlite_path: "runtime/statlite.sqlite"
polling:
  # Demo only: 10s polling fits the probe's 15s collection wait.
  # For production, use an interval of 30s or longer.
  interval: "10s"
targets:
  - name: javalin-demo
    type: statlite-metrics
    url: http://127.0.0.1:18087/statlite/metrics
