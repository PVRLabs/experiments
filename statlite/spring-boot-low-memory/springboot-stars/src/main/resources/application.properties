spring.application.name=stars

# Low-RAM Tomcat
server.port=8080
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=1
server.tomcat.accept-count=10
server.tomcat.max-connections=20

# Embedded H2 (file-backed so history survives restarts)
spring.datasource.url=jdbc:h2:file:./data/starsdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Single-thread scheduler is enough for one poll job
spring.task.scheduling.pool.size=1

# Up to 4 owner/repo pairs (comma-separated). Override with APP_GITHUB_REPOS.
app.github.repos=PVRLabs/statlite,PVRLabs/aibadger,scriptella/scriptella-etl
app.github.api-base-url=https://api.github.com
# Optional: export GITHUB_TOKEN to raise the unauthenticated 60 req/hour cap
app.github.token=${GITHUB_TOKEN:}

# Actuator — health + JVM/app metrics only (no heapdump/env)
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Star Pulse
info.app.package=pvrlabs
