micronaut.application.name=market-replay
micronaut.server.port=${SERVER_PORT:8080}
micronaut.router.static-resources.default.mapping=/**
micronaut.router.static-resources.default.paths=classpath:public
micronaut.metrics.enabled=true
micronaut.metrics.export.prometheus.enabled=true
endpoints.prometheus.sensitive=false
endpoints.health.sensitive=false
endpoints.health.details-visible=ANONYMOUS
datasources.default.url=${MARKET_DB_URL:`jdbc:h2:file:./data/market-replay;DB_CLOSE_ON_EXIT=FALSE`}
datasources.default.driver-class-name=org.h2.Driver
datasources.default.username=sa
datasources.default.password=
datasources.default.minimum-idle=1
datasources.default.maximum-pool-size=4
market.fixture-url=${MARKET_FIXTURE_URL:`http://127.0.0.1:8090/quotes`}
market.poll-interval-ms=${MARKET_POLL_INTERVAL_MS:60000}
market.poll-initial-delay-ms=${MARKET_POLL_INITIAL_DELAY_MS:0}
