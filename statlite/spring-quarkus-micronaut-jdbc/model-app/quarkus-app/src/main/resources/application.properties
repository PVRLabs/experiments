quarkus.application.name=market-replay
quarkus.http.port=${SERVER_PORT:8080}
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=${MARKET_DB_URL:jdbc:h2:file:./data/market-replay;DB_CLOSE_ON_EXIT=FALSE}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.devservices.enabled=false
market.fixture-url=${MARKET_FIXTURE_URL:http://127.0.0.1:8090/quotes}
market.poll-interval-ms=${MARKET_POLL_INTERVAL_MS:60000}
market.poll-initial-delay-ms=${MARKET_POLL_INITIAL_DELAY_MS:0}
