spring.application.name=market-replay
spring.datasource.url=${MARKET_DB_URL:jdbc:h2:file:./data/market-replay;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Market Replay Model App
info.app.workload=scheduled quote synchronization, JDBC persistence, REST history, browser chart
market.fixture-url=${MARKET_FIXTURE_URL:http://127.0.0.1:8090/quotes}
market.poll-interval-ms=${MARKET_POLL_INTERVAL_MS:60000}
market.poll-initial-delay-ms=${MARKET_POLL_INITIAL_DELAY_MS:0}

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
