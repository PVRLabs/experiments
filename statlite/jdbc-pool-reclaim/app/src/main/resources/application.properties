spring.application.name=${INSTANCE_NAME:pool-A}
server.address=127.0.0.1
server.port=${SERVER_PORT:8081}
spring.datasource.url=${POOL_DB_URL}
spring.datasource.username=${POOL_DB_USER}
spring.datasource.password=${POOL_DB_PASSWORD}
spring.datasource.hikari.pool-name=${INSTANCE_NAME:pool-A}
# Common experimental controls; default profile leaves pool sizing unset.
spring.datasource.hikari.idle-timeout=0
spring.datasource.hikari.max-lifetime=0
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.ApplicationName=${PG_APP_NAME:pool-A}
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=10
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.db.enabled=false
management.info.env.enabled=true
info.app.name=${INSTANCE_NAME:pool-A}
info.app.workload=bounded JDBC connection occupancy
experiment.hold-ms=${HOLD_MS:1000}
experiment.gate-timeout-ms=5000
